<!--
  DriveTools Microsoft Edition · Favicon snippet
  Copie estas linhas para dentro do <head> do seu HTML / template.
  Os arquivos referenciados devem estar na raiz do site (ou ajuste os caminhos).
-->

<!-- favicon clássico (multi-resolução: 16/32/48 no .ico) -->
<link rel="icon" href="/favicon.ico" sizes="any">

<!-- favicon SVG (renderiza nítido em qualquer DPI, navegadores modernos) -->
<link rel="icon" type="image/svg+xml" href="/logo.svg">

<!-- PNG explícitos para navegadores que ignoram o .ico -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">

<!-- Apple touch icon (iOS / iPadOS, atalho na home screen) -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- PWA / Android (referenciados pelo manifest) -->
<link rel="manifest" href="/site.webmanifest">

<!-- Cor da theme bar do navegador (Chrome mobile, Edge mobile, Safari iOS) -->
<meta name="theme-color" content="#0A84FF">
